  <g fill="#f4f4f6">
    <rect x="6" y="10" width="20" height="1.5"/>
    <rect x="6" y="15.25" width="12" height="1.5"/>
    <rect x="6" y="20.5" width="16" height="1.5"/>
  </g>
</svg>
