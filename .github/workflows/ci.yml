name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes the running job pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: backend · ruff + pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install
        working-directory: backend
        run: uv sync --frozen

      - name: Lint
        working-directory: backend
        run: uv run ruff check .

      # pytest-env pins DATABASE_URL to in-memory sqlite, so no service container
      # is needed and a test run can never reach a real database.
      - name: Test
        working-directory: backend
        run: uv run pytest -q

  frontend:
    name: frontend · typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned: with no version and no root package.json, the action cannot resolve
      # one and fails before installing anything.
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: frontend
        run: pnpm exec tsc --noEmit

      - name: Build
        working-directory: frontend
        shell: bash   # for pipefail: without it `tee` masks a failed build
        env:
          NEXT_PUBLIC_SITE_URL: https://remembrancer.example
          NEXT_PUBLIC_SITE_NAME: Remembrancer
        run: pnpm build | tee build.log

      # The one check that must not regress. Reading headers()/cookies()/searchParams
      # anywhere in that subtree silently turns the route dynamic: the build still
      # succeeds and the OG tags still look right, but Django starts absorbing every
      # federated preview fetch, which is exactly what static rendering prevents.
      - name: Review pages must stay statically generated
        working-directory: frontend
        run: |
          if ! grep -qE '● /reviews/\[slug\]' build.log; then
            echo "::error::/reviews/[slug] is no longer SSG (●). Route table:"
            sed -n '/^Route (app)/,/^$/p' build.log
            exit 1
          fi

  e2e:
    name: e2e · full stack, production posture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned: with no version and no root package.json, the action cannot resolve
      # one and fails before installing anything.
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: e2e/pnpm-lock.yaml

      # DJANGO_DEBUG=false over real TLS, because that is the only configuration in
      # which SECURE_SSL_REDIRECT, HSTS, secure cookies and CSRF_TRUSTED_ORIGINS are
      # live. A suite that passes with DEBUG on proves nothing about the deployment.
      # Caddy issues an internal cert for `localhost`; Playwright ignores it.
      - name: Compose an environment
        run: |
          sed -e 's|^SITE_URL=.*|SITE_URL=https://localhost:8443|' \
              -e 's|^SITE_HOST=.*|SITE_HOST=localhost|' \
              -e 's|^DJANGO_ALLOWED_HOSTS=.*|DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1,web,caddy|' \
              -e 's|^NEXT_PUBLIC_SITE_URL=.*|NEXT_PUBLIC_SITE_URL=https://localhost:8443|' \
              -e "s|^DJANGO_SECRET_KEY=.*|DJANGO_SECRET_KEY=$(openssl rand -hex 40)|" \
              -e "s|^REVALIDATE_SECRET=.*|REVALIDATE_SECRET=$(openssl rand -hex 40)|" \
              -e "s|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=ci-postgres-password|" \
              -e "s|^DATABASE_URL=.*|DATABASE_URL=postgres://remembrancer:ci-postgres-password@postgres:5432/remembrancer|" \
              .env.example > .env
          cat > compose.override.yaml <<'YAML'
          services:
            caddy:
              ports: !override
                - "8443:443"
                - "8081:80"
          YAML

      # `docker compose run` would build implicitly, but doing it as its own step keeps
      # a build failure distinguishable from the gate below rejecting the secrets.
      - name: Build the backend image
        run: docker compose build web

      # `web` refuses to boot on the placeholder secrets shipped in .env.example.
      # Proving that here keeps the guard honest.
      - name: The deploy gate rejects the example secrets
        run: |
          if docker compose --env-file .env.example run --rm --no-deps web \
               python manage.py check --deploy --fail-level ERROR; then
            echo "::error::check --deploy accepted the placeholder secrets from .env.example"
            exit 1
          fi
          echo "refused, as intended"

      - name: Start the stack
        run: docker compose up -d --build

      - name: Wait for the proxy
        run: |
          for _ in $(seq 1 60); do
            code=$(curl -ks -o /dev/null -w '%{http_code}' https://localhost:8443/api/reviews || true)
            [ "$code" = "200" ] && echo "up" && exit 0
            sleep 5
          done
          echo "::error::stack did not come up"; docker compose logs --tail 80; exit 1

      - name: Seed content and warm the cache
        env:
          DJANGO_SUPERUSER_PASSWORD: ci-admin-password-9f2b
        run: |
          docker compose exec -T web python manage.py shell < backend/tests/seed_demo.py
          docker compose exec -T -e DJANGO_SUPERUSER_PASSWORD="$DJANGO_SUPERUSER_PASSWORD" web \
            python manage.py createsuperuser --noinput --username ci --email ci@example.invalid
          # A fresh `next build` cannot reach Django, so the index ships empty.
          docker compose exec -T web python manage.py revalidate_all

      - name: Install Playwright
        working-directory: e2e
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium

      - name: Test
        working-directory: e2e
        env:
          BASE_URL: https://localhost:8443
          HTTP_BASE_URL: http://localhost:8081
          ADMIN_USER: ci
          ADMIN_PASSWORD: ci-admin-password-9f2b
          ADMIN_PATH: steward
        run: pnpm exec playwright test

      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail 200

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
